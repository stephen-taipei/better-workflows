name: Stable release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character origin/main revision already deployed to betterworkflows.dev
        required: true
        type: string
      conformance_run_id:
        description: Tier 1 host conformance workflow run bound to the same revision
        required: true
        type: string
      authority_confirmation:
        description: Type "release Better Workflows v4.0.0"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read
  id-token: write
  attestations: write

concurrency:
  group: better-workflows-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: stable-release
    env:
      GH_TOKEN: ${{ github.token }}
      SBW_STATE_ROOT: ${{ runner.temp }}/sbw-release-state
      SBW_RELEASE_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run fresh release validation
        run: |
          test "$(git rev-parse HEAD)" = "${SBW_RELEASE_REVISION}"
          npm test --prefix plugins/better-workflows
          npm run test:release-tag --prefix plugins/better-workflows
          node --test scripts/tests/*.test.mjs
          python -m pip install ansible-core==2.21.3
          ansible-galaxy collection install community.general:==13.0.1
          ANSIBLE_LOCAL_TEMP="${RUNNER_TEMP}/ansible-local" \
            ansible-playbook -i deploy/ansible/inventory/frontend.ini.example \
            deploy/ansible/release.yml --syntax-check
          ANSIBLE_LOCAL_TEMP="${RUNNER_TEMP}/ansible-local" \
            ansible-playbook -i deploy/ansible/inventory/frontend.ini.example \
            deploy/ansible/isolated-ingress.yml --syntax-check
      - name: Download all eight source-bound conformance envelopes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.conformance_run_id }}
          pattern: better-workflows-host-conformance-*-${{ inputs.revision }}
          path: ${{ runner.temp }}/host-conformance
      - name: Verify OIDC attestations and the exact 8-combination matrix
        env:
          SBW_CONFORMANCE_RUN_ID: ${{ inputs.conformance_run_id }}
          SBW_CONFORMANCE_ARTIFACT_DIR: ${{ runner.temp }}/host-conformance
        run: node plugins/better-workflows/scripts/release-conformance-gate.mjs
      - name: Verify the deployed exact SHA and all 41 public locale pages
        run: node scripts/website-public-qa.mjs
      - name: Attest the exact public website QA receipt
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/sbw-release-state/release-gates/${{ inputs.revision }}/website-public-qa.json
      - name: Publish and reconcile the stable tag and GitHub Release
        env:
          SBW_FRESH_TEST_RESULT: PASS
          SBW_RELEASE_AUTHORITY_CONFIRMATION: ${{ inputs.authority_confirmation }}
          SBW_HOST_GATE_RECEIPT: ${{ runner.temp }}/sbw-release-state/release-gates/${{ inputs.revision }}/host-conformance.json
          SBW_WEBSITE_QA_RECEIPT: ${{ runner.temp }}/sbw-release-state/release-gates/${{ inputs.revision }}/website-public-qa.json
        run: node plugins/better-workflows/scripts/stable-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-workflows-stable-release-${{ inputs.revision }}
          path: ${{ runner.temp }}/sbw-release-state/release-gates/${{ inputs.revision }}/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Attest the terminal stable-release receipt
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/sbw-release-state/release-gates/${{ inputs.revision }}/stable-release.json
