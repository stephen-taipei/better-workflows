# V6 Core on the two pinned Node versions, on GitHub-hosted Ubuntu runners.
# V5 is frozen on the frozen/v5 branch together with its own workflows.
#
# The repository is public, so GitHub-hosted runners cost nothing and every
# job starts on a fresh VM that is thrown away afterwards. That is also why
# pull requests from forks run here: they get a read-only token, no secrets,
# and no machine of the owner's. Do not move these jobs back onto a
# self-hosted runner: in a public repository a fork pull request can edit
# this file and schedule its own code on any runner the repository can reach.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.21.0', '22.23.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Confirm the exact Node version
        shell: bash
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: test "$(node --version)" = "v${EXPECTED_NODE}"
      - name: Test V6 Core
        run: npm test --prefix packages/bw-core
      - name: Check the localized READMEs match their catalog
        run: node docs/locales/build.mjs --check
      - name: Check the website builds in every locale with no broken links
        run: node website/build.mjs --check
      - name: Validate the Claude Code and Codex plugin manifests and versions
        shell: bash
        run: |
          node -e "
          const read = (f) => JSON.parse(require('fs').readFileSync(f, 'utf8'));
          const core = 'packages/bw-core/';
          read(core + '.claude-plugin/marketplace.json');
          read(core + 'hooks/hooks.json');
          const { version } = read(core + 'package.json');
          if (read(core + '.claude-plugin/plugin.json').version !== version) throw new Error('package.json and plugin.json versions differ');
          if (read(core + '.codex-plugin/plugin.json').version !== version) throw new Error('package.json and .codex-plugin/plugin.json versions differ');
          if (read('.claude-plugin/marketplace.json').plugins[0].source !== './packages/bw-core') throw new Error('the root marketplace must point at packages/bw-core');
          "
  attribution:
    name: No commit credits an AI assistant
    # Only the commits a pull request adds; main already has older ones.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Test the check
        run: node --test scripts/check-attribution.test.mjs
      - name: Check the pull request's commits
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-attribution.mjs "${BASE_SHA}..${HEAD_SHA}"
  test:
    # The one check branch protection may require. It checks out nothing and
    # only aggregates the jobs above.
    name: test
    needs: [core, attribution]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Core lane and the attribution check
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core.result }}
          ATTRIBUTION_RESULT: ${{ needs.attribution.result }}
        run: |
          set -euo pipefail
          echo "core: ${CORE_RESULT}; attribution: ${ATTRIBUTION_RESULT}"
          test "${CORE_RESULT}" = success
          case "${ATTRIBUTION_RESULT}" in success|skipped) ;; *) exit 1 ;; esac
