# V6 Core on the two pinned Node versions, on Linux and macOS. V5 is frozen on
# the frozen/v5 branch together with its own workflows.
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ['22.23.3', '24.21.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Confirm the exact Node version
        shell: bash
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: test "$(node --version)" = "v${EXPECTED_NODE}"
      - name: Test V6 Core
        run: npm test --prefix packages/bw-core
      - name: Check the localized READMEs match their catalog
        run: node docs/locales/build.mjs --check
      - name: Validate the Claude Code plugin manifest
        shell: bash
        run: node -e "for (const f of ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'hooks/hooks.json']) JSON.parse(require('fs').readFileSync('packages/bw-core/' + f, 'utf8'))"
  test:
    name: test
    needs: [core]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every Core lane
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          set -euo pipefail
          test "${CORE_RESULT}" = success
