# Public Auto-only macOS smoke and protected runtime qualification. Stable admission remains separate.
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime / Node ${{ matrix.node }}
    runs-on: macos-15
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.3', '24.21.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Confirm exact source and macOS runtime
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(node --version)" = "v${EXPECTED_NODE}"
      - name: Validate workflow syntax with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          actionlint_dir="$(mktemp -d "${RUNNER_TEMP}/actionlint.XXXXXX")"
          trap 'rm -f "${actionlint_dir}/actionlint.tar.gz" "${actionlint_dir}/actionlint"; rmdir "${actionlint_dir}"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${actionlint_dir}/actionlint.tar.gz" \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_arm64.tar.gz'
          printf '%s  %s\n' 'aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f' \
            "${actionlint_dir}/actionlint.tar.gz" | shasum -a 256 -c -
          tar -xzf "${actionlint_dir}/actionlint.tar.gz" -C "${actionlint_dir}" actionlint
          "${actionlint_dir}/actionlint" -shellcheck= -pyflakes=
      - name: Exercise frozen POSIX process and recovery suites
        shell: bash
        working-directory: plugins/better-workflows
        run: |
          set -euo pipefail
          node --experimental-vm-modules --test --test-reporter=tap --test-concurrency=1 \
            scripts/tests/posix-owned-process-adapter.test.mjs \
            scripts/tests/native-v3-command-runner.test.mjs \
            scripts/tests/native-v3-production-recovery.test.mjs \
            scripts/tests/native-v3-plan-runner.test.mjs \
            scripts/tests/native-v3-plan-runner-recovery.test.mjs \
            scripts/tests/platform-receipts-v1.test.mjs
      - name: Exercise runtime feature suites
        shell: bash
        working-directory: plugins/better-workflows
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          set -euo pipefail
          set --
          case "${EXPECTED_NODE}" in 22.*) set -- --experimental-test-isolation=none ;; esac
          node "$@" --experimental-vm-modules --test --test-reporter=tap --test-concurrency=1 \
            scripts/tests/runtime-support.test.mjs \
            scripts/tests/workspace.test.mjs \
            scripts/tests/auto-policy-v1.test.mjs
      - name: Exercise execution safety and incident CLI
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            plugins/better-workflows/scripts/tests/execution-admission-v1.test.mjs \
            plugins/better-workflows/scripts/tests/execution-runtime-v1.test.mjs \
            plugins/better-workflows/scripts/tests/execution-runtime-recovery-v1.test.mjs \
            plugins/better-workflows/scripts/tests/execution-runtime-stop-race.test.mjs \
            plugins/better-workflows/scripts/tests/incident-cli-sbw.test.mjs
      - name: Exercise public Auto skill
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            plugins/better-workflows/scripts/tests/skills.test.mjs
      - name: Exercise Apache wire package
        run: npm test --prefix packages/better-workflows-wire
      - name: Exercise V6 Core package
        run: npm test --prefix packages/bw-core
      - name: Check exact RC1 generated documents
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-localized-markdown.mjs --check
          node scripts/generate-localized-support.mjs --check
          node scripts/generate-localized-policies.mjs --check
      - name: Exercise fixed public site suites
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            scripts/tests/rc1-bilingual-site-contract.test.mjs \
            scripts/tests/structured-data-source.test.mjs \
            scripts/tests/website-public-qa-documents.test.mjs \
            scripts/tests/website.test.mjs
  runtime-qualification-v2:
    name: Runtime qualification v2 / ${{ matrix.lane }}
    # V5 is frozen at RC; this owner-signed lane runs only on manual dispatch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: v5-runtime-qualification
    runs-on: macos-15
    timeout-minutes: 95
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: macos-node22
            node: '22.23.3'
          - lane: macos-node24
            node: '24.21.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Execute and capture runtime-v2 qualification
        id: runtime
        env:
          SBW_RUNTIME_LANE: ${{ matrix.lane }}
          SBW_RUNTIME_QUALIFICATION_TARGET_POLICY_JSON: ${{ vars.SBW_RUNTIME_QUALIFICATION_TARGET_POLICY_JSON }}
          SBW_RUNTIME_QUALIFICATION_TARGET_POLICY_SHA256: ${{ vars.SBW_RUNTIME_QUALIFICATION_TARGET_POLICY_SHA256 }}
        run: node plugins/better-workflows/scripts/runtime-qualification-ci-v2.mjs
      - name: Upload bounded runtime-v2 evidence
        if: always() && steps.runtime.outputs.directory != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-workflows-runtime-v2-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.runtime.outputs.directory }}/qualification.json
            ${{ steps.runtime.outputs.directory }}/posix-process.stdout.tap
            ${{ steps.runtime.outputs.directory }}/posix-process.stderr.log
            ${{ steps.runtime.outputs.directory }}/runtime-features.stdout.tap
            ${{ steps.runtime.outputs.directory }}/runtime-features.stderr.log
            ${{ steps.runtime.outputs.directory }}/resources.jsonl
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
      - name: Attest the exact successful runtime-v2 envelope
        if: success() && steps.runtime.outcome == 'success' && steps.runtime.outputs.receipt != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.runtime.outputs.receipt }}
  core-linux:
    name: Core / Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.3', '24.21.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Exercise V6 Core package
        run: npm test --prefix packages/bw-core
  test:
    name: test
    needs: [runtime, core-linux]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require both exact Node lanes
        shell: bash
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          CORE_LINUX_RESULT: ${{ needs.core-linux.result }}
        run: |
          set -euo pipefail
          test "${RUNTIME_RESULT}" = success
          test "${CORE_LINUX_RESULT}" = success
