---
- name: Deploy Better Workflows static frontend only
  hosts: frontend
  become: true
  gather_facts: false
  vars:
    frontend_primary_domain: betterworkflows.dev
    frontend_alias_domains:
      - betterworkflows.org
    frontend_deploy_root: /var/www/betterworkflows.dev
    frontend_release_id: "{{ lookup('env', 'SITE_RELEASE_ID') }}"
    frontend_artifact_path: "{{ lookup('env', 'SITE_ARTIFACT_PATH') }}"
    frontend_deploy_user: deploy
    frontend_deploy_group: deploy
    frontend_current_path: "{{ frontend_deploy_root }}/current"
    frontend_release_path: "{{ frontend_deploy_root }}/releases/{{ frontend_release_id }}"
    frontend_letsencrypt_webroot: /var/www/letsencrypt
    frontend_tls_enabled: false
    frontend_render_tls_enabled: false
    frontend_issue_certificate: false
    frontend_certbot_method: webroot
    frontend_certbot_email: "{{ lookup('env', 'CERTBOT_EMAIL') }}"
    frontend_ssl_certificate: "/etc/letsencrypt/live/{{ frontend_primary_domain }}/fullchain.pem"
    frontend_ssl_certificate_key: "/etc/letsencrypt/live/{{ frontend_primary_domain }}/privkey.pem"

  pre_tasks:
    - name: Require a bounded release id
      ansible.builtin.assert:
        that:
          - frontend_release_id | length > 0
          - frontend_release_id is match('^[A-Za-z0-9._-]+$')
        fail_msg: "Set SITE_RELEASE_ID to a bounded revision or release identifier."

    - name: Require a local static artifact
      ansible.builtin.stat:
        path: "{{ frontend_artifact_path }}"
      delegate_to: localhost
      become: false
      register: frontend_artifact

    - name: Refuse missing or non-file artifact
      ansible.builtin.assert:
        that:
          - frontend_artifact.stat.exists
          - frontend_artifact.stat.isreg
        fail_msg: "SITE_ARTIFACT_PATH must point to the built website tarball."

    - name: Confirm the existing deploy account is available
      ansible.builtin.getent:
        database: passwd
        key: "{{ frontend_deploy_user }}"

    - name: Validate certificate inputs when certificate issuance is requested
      ansible.builtin.assert:
        that:
          - frontend_primary_domain | length > 0
          - frontend_certbot_email | length > 0
        fail_msg: "TLS mode requires the project certificate to exist before enabling it."
      when: frontend_issue_certificate | bool

  tasks:
    - name: Create only this project's release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ frontend_deploy_user }}"
        group: "{{ frontend_deploy_group }}"
        mode: "0755"
      loop:
        - "{{ frontend_deploy_root }}"
        - "{{ frontend_deploy_root }}/releases"
        - "{{ frontend_deploy_root }}/shared"
        - "{{ frontend_release_path }}"

    - name: Upload and extract the immutable website release
      ansible.builtin.unarchive:
        src: "{{ frontend_artifact_path }}"
        dest: "{{ frontend_release_path }}"
        remote_src: false
        owner: "{{ frontend_deploy_user }}"
        group: "{{ frontend_deploy_group }}"
        mode: "0755"

    - name: Verify the release entrypoints before activation
      ansible.builtin.stat:
        path: "{{ frontend_release_path }}/{{ item }}"
      loop:
        - index.html
        - healthz
        - release.json
      register: frontend_entrypoints

    - name: Refuse an incomplete static release
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isreg
        fail_msg: "The Better Workflows artifact is missing {{ item.item }}."
      loop: "{{ frontend_entrypoints.results }}"

    - name: Select the initial project vhost mode
      ansible.builtin.set_fact:
        frontend_render_tls_enabled: >-
          {{ (frontend_tls_enabled | bool) and not (frontend_issue_certificate | bool) }}

    - name: Point this project's current symlink at the new release
      ansible.builtin.file:
        src: "{{ frontend_release_path }}"
        dest: "{{ frontend_current_path }}"
        state: link
        force: true
        owner: "{{ frontend_deploy_user }}"
        group: "{{ frontend_deploy_group }}"

    - name: Issue this project's certificate with standalone HTTP-01 when selected
      ansible.builtin.command: >-
        certbot certonly --standalone --preferred-challenges http --http-01-port 80
        --non-interactive --agree-tos --keep-until-expiring
        --email {{ frontend_certbot_email }}
        {% for domain in [frontend_primary_domain] + frontend_alias_domains %}-d {{ domain }} {% endfor %}
      register: frontend_standalone_certbot_result
      changed_when: >-
        'Successfully received certificate' in frontend_standalone_certbot_result.stdout or
        'Congratulations' in frontend_standalone_certbot_result.stdout
      when:
        - frontend_issue_certificate | bool
        - frontend_certbot_method == 'standalone'

    - name: Use this project's certificate in its Nginx config after standalone issuance
      ansible.builtin.set_fact:
        frontend_render_tls_enabled: true
      when:
        - frontend_issue_certificate | bool
        - frontend_certbot_method == 'standalone'

    - name: Install only the Better Workflows Nginx site file
      ansible.builtin.template:
        src: betterworkflows.conf.j2
        dest: /etc/nginx/sites-available/betterworkflows.conf
        owner: root
        group: root
        mode: "0644"
      register: frontend_nginx_config

    - name: Enable only the Better Workflows Nginx site link
      ansible.builtin.file:
        src: /etc/nginx/sites-available/betterworkflows.conf
        dest: /etc/nginx/sites-enabled/betterworkflows.conf
        state: link
        force: false

    - name: Validate the whole Nginx configuration before any reload
      ansible.builtin.command: nginx -t
      changed_when: false
      register: frontend_nginx_test

    - name: Reload Nginx only after a successful whole-config validation
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: frontend_nginx_test.rc == 0 and frontend_nginx_config.changed

    - name: Issue the project certificate only when explicitly requested
      ansible.builtin.command: >-
        certbot certonly --webroot --webroot-path {{ frontend_letsencrypt_webroot }}
        --non-interactive --agree-tos --keep-until-expiring
        --email {{ frontend_certbot_email }}
        {% for domain in [frontend_primary_domain] + frontend_alias_domains %}-d {{ domain }} {% endfor %}
      register: frontend_certbot_result
      changed_when: >-
        'Successfully received certificate' in frontend_certbot_result.stdout or
        'Congratulations' in frontend_certbot_result.stdout
      when:
        - frontend_issue_certificate | bool
        - frontend_certbot_method == 'webroot'

    - name: Enable TLS for this project after its certificate is issued
      ansible.builtin.set_fact:
        frontend_render_tls_enabled: true
      when:
        - frontend_issue_certificate | bool
        - frontend_certbot_method == 'webroot'

    - name: Render this project's TLS Nginx config after certificate issuance
      ansible.builtin.template:
        src: betterworkflows.conf.j2
        dest: /etc/nginx/sites-available/betterworkflows.conf
        owner: root
        group: root
        mode: "0644"
      when:
        - frontend_issue_certificate | bool
        - frontend_certbot_method == 'webroot'
      register: frontend_tls_config

    - name: Revalidate Nginx after this project's TLS config change
      ansible.builtin.command: nginx -t
      changed_when: false
      when:
        - frontend_issue_certificate | bool
        - frontend_certbot_method == 'webroot'

    - name: Reload Nginx after this project's TLS config change
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when:
        - frontend_issue_certificate | bool
        - frontend_certbot_method == 'webroot'
